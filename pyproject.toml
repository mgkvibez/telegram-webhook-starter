[project]
name = "telegram-webhook-starter"
version = "0.1.0"
description = "The simplest correct Telegram webhook bot: one FastAPI file, async, deployable in 60 seconds."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
