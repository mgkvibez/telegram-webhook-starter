# One-click deploy target. Render reads this file and creates the service.
services:
  - type: web
    name: telegram-webhook-starter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false                 # you paste this from @BotFather
      - key: WEBHOOK_SECRET
        generateValue: true         # Render invents a strong one for you
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"
